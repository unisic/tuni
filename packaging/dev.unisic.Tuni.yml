# Flatpak manifest.
#
# Two toolchains have to be in the build sandbox: Rust, from the SDK extension,
# and Zig, because libghostty-vt is Zig source compiled during the build.
#
# The build needs the network for the cargo registry and for the Zig packages
# Ghostty depends on, both fetched by the build. Build it with
#
#   flatpak-builder --user --install --force-clean \
#       --install-deps-from=flathub build packaging/dev.unisic.Tuni.yml
#
# See packaging/README.md for what a Flathub submission would need on top of
# this, which is offline sources for both.
id: dev.unisic.Tuni
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: tuni

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # The host's ssh-agent. `ssh` runs inside the sandbox, so without this the
  # agent it would authenticate with is simply not reachable and every
  # connection falls back to asking for the key's passphrase.
  - --socket=ssh-auth
  # A terminal workspace whose file tree and Git panel only reached its own
  # sandbox would be a terminal that cannot see the code in it.
  - --filesystem=host
  # git, and whatever the shell in a pane runs, are the point of the program.
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/run/build/tuni/zig
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/tuni/cargo
    # The Ghostty release from the sources below, so the Makefile fetches
    # nothing of its own. See GHOSTTY_VERSION there for why it is not the
    # commit libghostty-rs pins.
    GHOSTTY_SOURCE_DIR: /run/build/tuni/ghostty

modules:
  - name: tuni
    buildsystem: simple
    sources:
      - type: dir
        path: ..
      # The Ghostty source builds with the Zig it names and no other, so that
      # version comes down with the rest rather than whatever the SDK has.
      - type: archive
        url: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
        sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        dest: zig
        strip-components: 1
        only-arches: [x86_64]
      - type: archive
        url: https://ziglang.org/download/0.17.0/zig-aarch64-linux-0.17.0.tar.xz
        sha256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
        dest: zig
        strip-components: 1
        only-arches: [aarch64]
      # Keep in step with GHOSTTY_VERSION and GHOSTTY_SHA256 in the Makefile.
      - type: archive
        url: https://release.files.ghostty.org/1.4.0/ghostty-1.4.0.tar.gz
        sha256: cb188ac6c3a8278d5fd7bfef15d8c017104c87f638b5560eb38024a71ae0f005
        dest: ghostty
        strip-components: 1
    build-commands:
      - make install PREFIX=/app
