name: AUR

# Retargets both AUR recipes, `tuni` from source and `tuni-bin` repacking the
# release's Arch package, at a published release and pushes them. release.yml
# calls this after it has published; workflow_dispatch is here because it is
# the only retry: a release is not cut twice for one AUR push that failed.
#
# sync.sh hashes the published .pkg.tar.zst and the tag archive, so the
# release has to exist first.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Released version, without the leading v (e.g. 1.7.0)"
        type: string
        required: true

defaults:
  run:
    shell: bash

jobs:
  aur:
    name: AUR
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Install tooling
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Syu --noconfirm --needed git openssh namcap

      - uses: actions/checkout@v7

      # makepkg refuses to run as root, and the container is root. makepkg -s
      # installs build dependencies through sudo, so the user needs it without
      # a password.
      - name: Create the build user
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Configure SSH for the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [[ -z "$AUR_SSH_KEY" ]]; then
            echo "::error::AUR_SSH_KEY is not set: base64 -w0 < ~/.ssh/aur | gh secret set AUR_SSH_KEY --repo unisic/tuni"
            exit 1
          fi
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          # base64, because the runner hands a step's environment to the
          # container through a KEY=value file, and a value spanning lines
          # arrives as its first line only. A raw PEM key still works.
          if [[ "$AUR_SSH_KEY" == *"PRIVATE KEY"* ]]; then
            printf '%s\n' "$AUR_SSH_KEY" > /home/builder/.ssh/aur
          elif ! printf '%s' "$AUR_SSH_KEY" | base64 -d > /home/builder/.ssh/aur 2>/dev/null; then
            echo "::error::AUR_SSH_KEY is neither a PEM private key nor base64 of one"
            exit 1
          fi
          # Before the check: ssh refuses a key file others can read and would
          # report that as the format being wrong.
          chmod 600 /home/builder/.ssh/aur
          # A key ssh cannot parse would otherwise fail later as "Permission
          # denied (publickey)", which reads as the wrong account. The public
          # half, which the AUR account page shows, is the usual mistake.
          if ! ssh-keygen -y -f /home/builder/.ssh/aur >/dev/null 2>&1; then
            echo "::error::AUR_SSH_KEY is not an OpenSSH private key (the file without .pub)"
            exit 1
          fi
          # Pinned rather than ssh-keyscan'd: a keyscan trusts whatever answers
          # on the day, which is what a known_hosts file exists to prevent.
          cat > /home/builder/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          cat > /home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
              User aur
              IdentityFile ~/.ssh/aur
              IdentitiesOnly yes
          EOF
          chown -R builder:builder /home/builder/.ssh
          chmod 600 /home/builder/.ssh/config
          chmod 644 /home/builder/.ssh/known_hosts

      - name: Publish to the AUR
        # sync.sh reads the release through the API, which allows a runner's
        # shared address 60 requests an hour without a token. runuser keeps
        # the environment, so the build user sees it.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # An AUR package is read as the stable channel, and a helper would
          # hand a pre-release to everyone who runs paru -Syu.
          if [[ "$VERSION" =~ [a-zA-Z] ]]; then
            echo "::notice::${VERSION} is a pre-release; the AUR stays on the last stable version"
            exit 0
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -lc "
            set -e
            git config --global user.name 'Unisic'
            git config --global user.email 'contact@unisic.app'
            cd '$GITHUB_WORKSPACE/packaging/aur'
            bash ./sync.sh --version '$VERSION' --check bin --push
          "
