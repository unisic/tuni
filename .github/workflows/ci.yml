name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The Ghostty source the Makefile builds declares this its minimum.
  ZIG_VERSION: 0.17.0
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026

jobs:
  build:
    runs-on: ubuntu-latest
    # Fedora, because that is the desktop this is developed against and it
    # carries GTK 4 and libadwaita new enough without a PPA.
    container: fedora:44

    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            cargo rust rustfmt clippy gcc make git-core curl tar xz openssh-clients openssh-server \
            gtk4-devel libadwaita-devel gtksourceview5-devel sqlite-devel \
            desktop-file-utils libappstream-glib

      - uses: actions/checkout@v7

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${ZIG_SHA256}  zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | sha256sum -c -
          tar xf "zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          echo "${GITHUB_WORKSPACE}/zig-x86_64-linux-${ZIG_VERSION}" >> "${GITHUB_PATH}"

      # `make build` pins the CPU the release binary is compiled for, but the
      # tests below do not go through it and zig compiles those for whatever
      # machine ran them. The ubuntu-latest label hands out Intel and AMD parts
      # with different instruction sets, and a target directory restored onto
      # the other kind dies with SIGILL the first time anything calls in.
      # Hashing the CPU's own feature list into the key keeps a cache on the
      # machines it runs on.
      - name: Identify the runner's instruction set
        id: cpu
        run: |
          id="$(grep -m1 '^flags' /proc/cpuinfo | sha256sum | cut -c1-16)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Cache cargo and the Ghostty source
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-baseline-${{ steps.cpu.outputs.id }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-baseline-${{ steps.cpu.outputs.id }}-

      - name: Format
        run: cargo fmt --check

      # `make build`, not plain cargo: the Makefile is what pins the CPU the
      # Zig half compiles for, and a release built any other way is a release
      # that only runs on the machine that built it.
      - name: Build
        run: make build

      # The Makefile hands cargo the Ghostty release rather than the commit the
      # bindings pin; clippy and the tests below call cargo directly, so they
      # are pointed at the source the build just unpacked.
      - name: Point cargo at the Ghostty source
        run: echo "GHOSTTY_SOURCE_DIR=$(make -s ghostty-dir)" >> "$GITHUB_ENV"

      - name: Check the binary against the baseline CPU
        run: scripts/check-baseline.sh target/release/tuni-gtk

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # The parts of the install that a compiler cannot check.
      - name: Validate desktop integration
        run: |
          desktop-file-validate data/dev.unisic.Tuni.desktop
          appstream-util validate-relax --nonet data/dev.unisic.Tuni.metainfo.xml

      - name: Install into a staging root
        run: make install PREFIX=/usr DESTDIR="${GITHUB_WORKSPACE}/staging"

      - uses: actions/upload-artifact@v7
        with:
          name: tuni-x86_64
          path: staging

