[package]
name = "tuni-gtk"
description = "GTK4/libadwaita front end"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "tuni"
path = "src/main.rs"

[dependencies]
tuni-core.workspace = true
tuni-pty.workspace = true
tuni-vt.workspace = true

adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
# The same bridge tuni-pty crosses: a language server's reader thread feeds the
# main loop through one of these.
async-channel = "2"
# 4.14 for the path API the box drawing characters are stroked with. No floor
# is raised by it: libadwaita 1.6 already asks for a newer GTK than that.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
unicode-width = "0.2"
sourceview5 = { version = "0.11", features = ["v5_10"] }
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# The X11 half of the blur ask. KWin reads a window property there rather than
# a Wayland protocol, and writing one takes Xlib itself: GDK4 only sets the
# properties it knows about. `x11-dl` is the flavor of Xlib binding gdk4-x11's
# `xlib` feature speaks, and it finds the library at runtime the way GDK did.
gdk4-x11 = { version = "0.11", features = ["xlib"] }
x11-dl = "2.21"

