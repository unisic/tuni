[package]
name = "tuni-core"
description = "Portable workspace models: config, projects, panes, session persistence, git"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# Signals and the two sysconf values /proc numbers are measured in.
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Word-level comparison inside a changed line. Only that: the diff between two
# files is git's own, read as text.
similar = "2.7"
