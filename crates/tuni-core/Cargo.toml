[package]
name = "tuni-core"
description = "Portable workspace models: config, projects, panes, session persistence, git"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# Ghostty's URL regex ends on a lookbehind, which the plain `regex` crate
# refuses on principle; this is the engine that takes it.
fancy-regex = "0.16"
# Signals and the two sysconf values /proc numbers are measured in.
libc = "0.2"
# OpenCode keeps its sessions in SQLite, and reading them is the only reason
# this is here. The system library, not a bundled copy: every desktop this runs
# on has one.
rusqlite = { version = "0.40", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Word-level comparison inside a changed line. Only that: the diff between two
# files is git's own, read as text.
similar = "3.1"
# The editor's structural selection asks a real parse tree what encloses the
# cursor. The grammars are compiled in, like the themes: a fresh checkout works
# offline and an installed build carries no grammar directory. One crate per
# language the selection understands; a language without a maintained grammar
# crate simply does not grow selections.
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
