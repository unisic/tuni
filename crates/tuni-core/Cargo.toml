[package]
name = "tuni-core"
description = "Portable workspace models: config, projects, panes, session persistence, git"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# Signals and the two sysconf values /proc numbers are measured in.
libc = "0.2"
# OpenCode keeps its sessions in SQLite, and reading them is the only reason
# this is here. The system library, not a bundled copy: every desktop this runs
# on has one.
rusqlite = { version = "0.40", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Word-level comparison inside a changed line. Only that: the diff between two
# files is git's own, read as text.
similar = "2.7"
