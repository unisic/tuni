[package]
name = "tuni-pty"
description = "PTY spawning and I/O pumping for terminal sessions"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-channel = "2"
# For the one thing a hangup needs and `portable-pty` does not expose: SIGHUP to
# the shell's process group. Already in the tree as its own dependency.
libc = "0.2"
portable-pty = "0.9"
