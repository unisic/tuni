[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/unisic/tuni"
rust-version = "1.95"
version = "1.7.1"

[workspace.dependencies]
tuni-core = { path = "crates/tuni-core" }
tuni-pty = { path = "crates/tuni-pty" }
tuni-vt = { path = "crates/tuni-vt" }

# Pre-1.0 and expected to move with the pinned Ghostty source, so pin the rev.
# Everything that touches it lives behind the tuni-vt facade.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "9ede35b8ea94a55ed3608408d67e102883129f1e" }

[profile.release]
lto = "thin"
codegen-units = 1
